<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contacto Oficial — Batallando Tv</title>
    <link rel="stylesheet" href="./Formulario.css">
    <!-- ⚡ BOLT OPTIMIZATION: URI-encode spaces in favicon path for cross-browser consistency -->
    <link rel="icon" href="../Batallando/Batallando%20TV%202024.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1 class="logo bounce-in-text">Contacta a <span>Batallando</span></h1>

        <div class="contact-wrapper bounce-in-text">
            <div class="contact-form">
                <h3>Envíanos un mensaje</h3>
                <form action="https://formsubmit.co/batallandotvds@gmail.com" method="POST" id="formulario">
                    <p>
                        <label>Nombre completo</label>
                        <input type="text" name="fullname" required placeholder="Ingresa tu nombre">
                    </p>
                    <p>
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="tu@correo.com">
                    </p>
                    <p>
                        <label>Teléfono</label>
                        <input type="tel" name="Teléfono" required placeholder="8090000000">
                    </p>
                    <p>
                        <label>Nacionalidad</label>
                        <input type="text" name="Nacionalidad" placeholder="República Dominicana">
                    </p>
                    <p class="block">
                        <label>Mensaje</label>
                        <textarea name="Mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
                    </p>
                    <p class="block">
                        <button type="submit" value="Enviar">
                            Enviar Mensaje
                        </button>
                    </p>
                </form>
            </div>

            <div class="contact-info">
                <!-- ⚡ BOLT OPTIMIZATION: URI-encode spaces in image asset path -->
                <img src="../Batallando/Batallando%20TV%202024.png" alt="Batallando TV" class="bounce-in-text">

                <ul>
                    <li>

                        </svg>
                        <div style="text-align:left;">
                            <div style="font-weight:600;color:#fff;">Cabina / Principal</div>
                            <a href="tel:+18092621919" style="color:inherit;text-decoration:none;">809-262-1919</a> /
                            <a href="tel:+18092000866" style="color:inherit;text-decoration:none;">1-809-200-0866</a>
                        </div>
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                            height="20" style="flex-shrink:0;">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                        </svg>
                        <div style="text-align:left;">
                            <div style="font-weight:600;color:#fff;">Oficina</div>
                            <a href="tel:+18098273436" style="color:inherit;text-decoration:none;">809-827-3436</a> /
                            <a href="tel:+18093285874" style="color:inherit;text-decoration:none;">809-328-5874</a>
                        </div>
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                            height="20" style="flex-shrink:0;">
                            <path
                                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                        </svg>
                        <div style="text-align:left;">
                            <div style="font-weight:600;color:#fff;">WhatsApp</div>
                            <a href="https://wa.me/18296433436"
                                style="color:inherit;text-decoration:none;">829-643-3436</a>
                        </div>
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                            height="20" style="flex-shrink:0;">

                        <div style="text-align:left;">
                            <div style="font-weight:600;color:#fff;">Email</div>
                            <a href="mailto:batallandotvds@gmail.com"
                                style="color:inherit;text-decoration:none;">batallandotvds@gmail.com</a>
                        </div>
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"

                </ul>

                <a href="#" onclick="volverPagina(event)" class="btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16"
                        height="16">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        function volverPagina(e) {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "../../index.html";
            }
        }

        document.getElementById("formulario").addEventListener("submit", function (event) {
            // FormSubmit will handle the redirect/post natively.
            // Leaving native functionality, just showing alert before submission.
            setTimeout(() => {
                alert("¡Su mensaje está siendo enviado!");
            }, 100);
        });
    </script>
</body>
